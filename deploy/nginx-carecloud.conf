# CareCloud reverse-proxy blocks. Replace the two placeholder hostnames, drop
# this file at /etc/nginx/sites-available/carecloud.conf, symlink it into
# sites-enabled, then run certbot to add TLS. Removing this one file (and the
# symlink) fully unhooks the app from nginx.

# Staff console
server {
    listen 80;
    server_name CONSOLE_DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:4101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API: REST endpoints plus the Vapi webhook
server {
    listen 80;
    server_name API_DOMAIN;

    # Vapi end-of-call reports carry the full transcript; allow a large body.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
